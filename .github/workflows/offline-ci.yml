name: Offline verification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11.18'
      - run: python scripts/verify_source.py
      - run: python -m pip install -r requirements-linux-py311.lock
      - run: python -m pip install -c requirements-linux-py311.lock httpx==0.27.2
      - run: python -m pip check
      - name: Install local media tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/test_preview.js
      - name: Repeat offline evaluator self-test
        run: |
          python -m evals.run_offline --output evaluation-report.json
          python -m evals.run_offline --output evaluation-repeat.json
          cmp evaluation-report.json evaluation-repeat.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: synthetic-evaluator-report
          path: evaluation-report.json
          retention-days: 14
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11.18'
      - name: Resolve runtime dependencies
        run: |
          python -m venv /tmp/v2doc-runtime
          /tmp/v2doc-runtime/bin/python -m pip install -r requirements-linux-py311.lock
          /tmp/v2doc-runtime/bin/python -m pip check
          /tmp/v2doc-runtime/bin/python -m pip freeze > /tmp/v2doc-runtime.txt
          cat /tmp/v2doc-runtime.txt
      - name: Audit resolved dependencies
        run: |
          python -m pip install pip-audit==2.9.0
          python -m pip_audit -r /tmp/v2doc-runtime.txt --no-deps
