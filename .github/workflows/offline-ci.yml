name: Offline verification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -r api/requirements.txt httpx==0.27.2
      - name: Install local media tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/test_preview.js
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Resolve runtime dependencies
        run: |
          python -m venv /tmp/v2doc-runtime
          /tmp/v2doc-runtime/bin/python -m pip install -r api/requirements.txt
          /tmp/v2doc-runtime/bin/python -m pip freeze > /tmp/v2doc-runtime.txt
          cat /tmp/v2doc-runtime.txt
      - name: Audit resolved dependencies
        run: |
          python -m pip install pip-audit==2.9.0
          python -m pip_audit -r /tmp/v2doc-runtime.txt --no-deps
